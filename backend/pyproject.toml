[project]
name = "backend"
version = "0.1.0"
description = "Revenue Investigation Agent API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=1.0",
    "jwt>=1.4.0",
    "pydantic-settings>=2.0",
    "pwdlib>=0.3.1",
    "python-dotenv>=1.0",
    "sqlglot>=26.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
